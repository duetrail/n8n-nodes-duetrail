# Publishes this package to npm with a provenance statement.
#
# Provenance is not optional here: since 2026-05-01 n8n only accepts community
# nodes for verification if they were published from CI with one, so a manual
# `npm publish` from a laptop would produce a package that works but can never
# be verified — and the version number would be burned.
#
# Manual trigger only. An npm publish cannot be undone after 72 hours, so this
# must never fire off a plain push.
name: Publish n8n node

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify without publishing"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci --no-audit --no-fund

      # tsc --noEmit then the structural tests. The type check is the one that
      # matters: the structural tests read the TypeScript as text and cannot
      # tell whether it compiles.
      - run: npm test

      - run: npm run build

      # Verified nodes may not ship runtime dependencies, and the tarball must
      # carry both nodes plus the icon. Fail here rather than at review.
      - name: Verify package shape
        run: |
          node -e "
            const p = require('./package.json');
            if (p.dependencies && Object.keys(p.dependencies).length)
              throw new Error('runtime dependencies are not allowed for verified nodes');
            for (const f of [...p.n8n.nodes, ...p.n8n.credentials])
              if (!require('fs').existsSync(f)) throw new Error('missing built file: ' + f);
            if (!require('fs').existsSync('dist/nodes/DueTrail/duetrail.svg'))
              throw new Error('icon missing from dist');
            console.log('package shape ok:', p.name + '@' + p.version);
          "

      - name: Pack (dry run)
        if: ${{ inputs.dry_run }}
        run: npm pack --dry-run

      - name: Publish with provenance
        if: ${{ !inputs.dry_run }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
