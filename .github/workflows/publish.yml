# Publishes this package to npm with a provenance statement.
#
# Provenance is not optional here: since 2026-05-01 n8n only accepts community
# nodes for verification if they were published from CI with one, so a manual
# `npm publish` from a laptop would produce a package that works but can never
# be verified — and the version number would be burned.
#
# Manual trigger only. An npm publish cannot be undone after 72 hours, so this
# must never fire off a plain push.
name: Publish n8n node

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify without publishing"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10, which predates OIDC trusted publishing. Without
      # this the publish falls back to looking for a token that no longer
      # exists, and fails with an unhelpful auth error.
      - run: npm install -g npm@latest

      - run: npm ci --no-audit --no-fund

      # `npm test` builds first, then runs the tests. The build is not a separate
      # step because the runtime tests require dist/ — running them in the wrong
      # order passes locally, where dist/ is left over from a previous build, and
      # fails only in CI on a clean checkout.
      - run: npm test

      # Verified nodes may not ship runtime dependencies, and the tarball must
      # carry both nodes plus the icon. Fail here rather than at review.
      - name: Verify package shape
        run: |
          node -e "
            const p = require('./package.json');
            if (p.dependencies && Object.keys(p.dependencies).length)
              throw new Error('runtime dependencies are not allowed for verified nodes');
            for (const f of [...p.n8n.nodes, ...p.n8n.credentials])
              if (!require('fs').existsSync(f)) throw new Error('missing built file: ' + f);
            if (!require('fs').existsSync('dist/nodes/DueTrail/duetrail.svg'))
              throw new Error('icon missing from dist');
            console.log('package shape ok:', p.name + '@' + p.version);
          "

      - name: Pack (dry run)
        if: ${{ inputs.dry_run }}
        run: npm pack --dry-run

      # No token: the npm package is configured with a Trusted Publisher naming
      # this repo and this workflow file, so npm authenticates the OIDC token
      # minted by `id-token: write` above. Provenance is generated automatically.
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public

      # Trusted publishing failing open would publish without provenance, and
      # n8n refuses to verify a package that has none. Check rather than assume.
      #
      # Read dist.attestations.url from the registry instead of constructing an
      # attestations URL: npm publishes the authoritative, version-specific link
      # in the packument, and a guessed path 404s and fails a healthy release.
      - name: Verify provenance was attached
        if: ${{ !inputs.dry_run }}
        run: |
          set -e
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          for attempt in 1 2 3 4 5; do
            URL=$(npm view "$NAME@$VERSION" dist.attestations.url 2>/dev/null || true)
            if [ -n "$URL" ]; then
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
              if [ "$STATUS" = "200" ]; then
                echo "provenance verified for $NAME@$VERSION -> $URL"
                exit 0
              fi
              echo "attestation url present but returned HTTP $STATUS (attempt $attempt)"
            else
              echo "no dist.attestations yet (attempt $attempt)"
            fi
            sleep 10
          done
          echo "::error::$NAME@$VERSION has no provenance — trusted publishing did not engage"
          exit 1
